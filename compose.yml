name: overseer

services:
  # 1. Database (PostgreSQL for Boundary & Semaphore)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${BOUNDARY_DATABASE_USER:-boundary}
      POSTGRES_PASSWORD: ${BOUNDARY_DATABASE_PASSWORD:-boundarypassword}
      POSTGRES_DB: ${BOUNDARY_DATABASE:-boundary}
    volumes:
      - ${DATA_DIR:-/data}/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOUNDARY_DATABASE_USER:-boundary}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 2. OpenBao Server
  openbao:
    image: ghcr.io/openbao/openbao:2.6.2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
      BAO_API_ADDR: "http://127.0.0.1:8200"
      OPENBAO_SHAMIR_MODE: ${OPENBAO_SHAMIR_MODE:-auto}
    volumes:
      - ./openbao/config:/openbao/config:ro
      - ${DATA_DIR:-/data}/openbao:/openbao/data
      - ./openbao/scripts:/openbao/scripts:ro
    entrypoint: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 3. HashiCorp Boundary Controller
  boundary-controller:
    image: hashicorp/boundary:0.21.3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOUNDARY_POSTGRES_URL: "postgresql://${BOUNDARY_DATABASE_USER:-boundary}:${BOUNDARY_DATABASE_PASSWORD:-boundarypassword}@postgres:5432/${BOUNDARY_DATABASE:-boundary}?sslmode=disable"
      BOUNDARY_KMS_AEAD_ROOT_KEY: ${BOUNDARY_KMS_AEAD_ROOT_KEY:-}
      BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY: ${BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY:-}
      BOUNDARY_KMS_AEAD_RECOVERY_KEY: ${BOUNDARY_KMS_AEAD_RECOVERY_KEY:-}
    volumes:
      - ./boundary/config:/boundary/config:ro
      - ./boundary/scripts:/boundary/scripts:ro
      - ${DATA_DIR:-/data}/boundary:/boundary/data
    command: ["boundary", "server", "-config=/boundary/config/controller.hcl"]
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 4. HashiCorp Boundary Worker
  boundary-worker:
    image: hashicorp/boundary:0.21.3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      - boundary-controller
    environment:
      BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY: ${BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY:-}
    volumes:
      - ./boundary/config:/boundary/config:ro
      - ${DATA_DIR:-/data}/boundary:/boundary/data
    command: ["boundary", "server", "-config=/boundary/config/worker.hcl"]
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 5. Semaphore UI (Ansible Web UI & Orchestrator)
  semaphore:
    image: semaphoreui/semaphore:v2.19.12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: ${POSTGRES_HOST:-postgres}
      SEMAPHORE_DB_PORT: ${POSTGRES_PORT:-5432}
      SEMAPHORE_DB_USER: ${SEMAPHORE_DATABASE_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DATABASE_PASSWORD:-semaphorepassword}
      SEMAPHORE_DB: ${SEMAPHORE_DATABASE:-semaphore}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@overseer.local}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-semaphoreadmin}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-GS3py5Y8+GvF12x0fTfR18k2h4eE9W2d1C8N6Q8T4=0}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      BAO_ADDR: http://openbao:8200
    volumes:
      - ${DATA_DIR:-/data}/semaphore:/tmp/semaphore
      - ${DATA_DIR:-/data}/openbao:/openbao/data:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  backend:
    external: true
    name: backend
