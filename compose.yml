services:
  # 1. Database (PostgreSQL for Boundary & Semaphore)
  postgres:
    image: postgres:15-alpine
    container_name: overseer-postgres
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boundary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boundarypassword}
      POSTGRES_DB: ${POSTGRES_DB:-boundary}
    volumes:
      - ${DATA_DIR:-/data}/postgres:/var/lib/postgresql/data
    networks:
      - overseer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boundary}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 2. OpenBao Server
  openbao:
    image: openbao/openbao:2.1.0
    container_name: overseer-openbao
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
      BAO_API_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./openbao/config:/openbao/config:ro
      - ${DATA_DIR:-/data}/openbao:/openbao/data
      - ./openbao/scripts:/openbao/scripts:ro
    entrypoint: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    networks:
      - overseer-net
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 3. HashiCorp Boundary Controller
  boundary-controller:
    image: hashicorp/boundary:0.15
    container_name: overseer-boundary-controller
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9200:9200"
      - "9201:9201"
    environment:
      BOUNDARY_KMS_AEAD_ROOT_KEY: ${BOUNDARY_KMS_AEAD_ROOT_KEY:-sP191WKGvgcuEmhdREQBPBG5nhAAda4e+bQQnFRinCU=}
      BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY: ${BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY:-8pv7uU8g58aN8y1n8PqR8G3z7rW+V8eY9nQ2x3Z1v4U=}
      BOUNDARY_KMS_AEAD_RECOVERY_KEY: ${BOUNDARY_KMS_AEAD_RECOVERY_KEY:-uK382WKGvgcuEmhdREQBPBG5nhAAda4e+bQQnFRinCU=}
    volumes:
      - ./boundary/config:/boundary/config:ro
      - ./boundary/scripts:/boundary/scripts:ro
      - ${DATA_DIR:-/data}/boundary:/boundary/data
    command: ["boundary", "server", "-config=/boundary/config/controller.hcl"]
    networks:
      - overseer-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 4. HashiCorp Boundary Worker
  boundary-worker:
    image: hashicorp/boundary:0.15
    container_name: overseer-boundary-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      - boundary-controller
    ports:
      - "9202:9202"
    environment:
      BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY: ${BOUNDARY_KMS_AEAD_WORKER_AUTH_KEY:-8pv7uU8g58aN8y1n8PqR8G3z7rW+V8eY9nQ2x3Z1v4U=}
    volumes:
      - ./boundary/config:/boundary/config:ro
      - ${DATA_DIR:-/data}/boundary:/boundary/data
    command: ["boundary", "server", "-config=/boundary/config/worker.hcl"]
    networks:
      - overseer-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 5. Semaphore UI (Ansible Web UI & Orchestrator)
  semaphore:
    image: semaphoreui/semaphore:v2.10.35
    container_name: overseer-semaphore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgres
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB_USER: ${POSTGRES_USER:-boundary}
      SEMAPHORE_DB_PASS: ${POSTGRES_PASSWORD:-boundarypassword}
      SEMAPHORE_DB: ${SEMAPHORE_DB:-semaphore}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@overseer.local}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-semaphoreadmin}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-GS3py5Y8+GvF12x0fTfR18k2h4eE9W2d1C8N6Q8T4=0}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      BAO_ADDR: http://openbao:8200
    volumes:
      - ${DATA_DIR:-/data}/semaphore:/tmp/semaphore
      - ${DATA_DIR:-/data}/openbao:/openbao/data:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - overseer-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  overseer-net:
    driver: bridge
