name: overseer

services:
  # 1. OpenBao Server
  openbao:
    image: ghcr.io/openbao/openbao:2.6.2
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
      BAO_API_ADDR: "http://127.0.0.1:8200"
      OPENBAO_SHAMIR_MODE: ${OPENBAO_SHAMIR_MODE:-auto}
    volumes:
      - ./openbao/config:/openbao/config:ro
      - ${DATA_DIR:-/data}/openbao:/openbao/data
      - ./openbao/scripts:/openbao/scripts:ro
    entrypoint: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 2. Semaphore UI (Ansible Web UI & Orchestrator)
  semaphore:
    image: semaphoreui/semaphore:v2.19.12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB_PATH: /var/lib/semaphore
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@overseer.local}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-semaphoreadmin}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-GS3py5Y8+GvF12x0fTfR18k2h4eE9W2d1C8N6Q8T4=0}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      BAO_ADDR: http://openbao:8200
    volumes:
      - ${DATA_DIR:-/data}/semaphore-db:/var/lib/semaphore
      - ${DATA_DIR:-/data}/semaphore:/tmp/semaphore
      - ${DATA_DIR:-/data}/openbao:/openbao/data:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  backend:
    external: true
    name: backend
