---
- name: "[VAULT-001] Skip Vault SSH CA if disabled or key is empty"
  ansible.builtin.debug:
    msg: "Vault SSH CA is disabled (enable_vault_ssh_ca=false or vault_ssh_ca_public_key is empty). Skipping setup."
  when: not (enable_vault_ssh_ca | default(false) | bool) or (vault_ssh_ca_public_key | default('') | length == 0)

- name: "[VAULT-002] Check OpenSSH CA capability (requires OpenSSH >= 5.4, RHEL/CentOS 7+)"
  ansible.builtin.debug:
    msg: "Warning: CentOS 6 / OpenSSH 5.3 does not natively support TrustedUserCAKeys. Skipping Vault SSH CA setup for {{ inventory_hostname }}."
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6

- name: "[VAULT-003] Ensure SSH configuration directory exists"
  ansible.builtin.file:
    path: /etc/ssh
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - not (ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6)

- name: "[VAULT-004] Deploy Vault SSH CA Public Key"
  ansible.builtin.copy:
    content: "{{ vault_ssh_ca_public_key }}\n"
    dest: "{{ vault_ssh_ca_path }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - not (ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6)
  notify: Restart sshd for Vault CA

- name: "[VAULT-005] Ensure AuthorizedPrincipals directory exists"
  ansible.builtin.file:
    path: "{{ vault_ssh_principals_dir | default('/etc/ssh/auth_principals') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - admin_user is defined
    - not (ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6)

- name: "[VAULT-006] Create admin user principals file"
  ansible.builtin.copy:
    content: "admin\n{{ admin_user }}\n"
    dest: "{{ vault_ssh_principals_dir | default('/etc/ssh/auth_principals') }}/{{ admin_user }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - admin_user is defined
    - not (ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6)

- name: "[VAULT-007] Configure sshd to trust Vault CA Keys and AuthorizedPrincipals"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?TrustedUserCAKeys', line: "TrustedUserCAKeys {{ vault_ssh_ca_path }}" }
    - { regexp: '^#?AuthorizedPrincipalsFile', line: "AuthorizedPrincipalsFile {{ vault_ssh_principals_dir | default('/etc/ssh/auth_principals') }}/%u" }
  when:
    - enable_vault_ssh_ca | default(false) | bool
    - vault_ssh_ca_public_key | default('') | length > 0
    - not (ansible_distribution == "CentOS" and ansible_distribution_major_version | int <= 6)
  notify: Restart sshd for Vault CA
