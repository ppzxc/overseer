---
timezone: "Asia/Seoul"
locale: "en_US.UTF-8"
# NTP Pool 및 개별 Time Server 분리 구성 (Standard UTC 기준, Leap Smear 미적용 소스 일원화)
ntp_pools:
  - "kr.pool.ntp.org"

ntp_servers:
  - "time.kriss.re.kr"
  - "time2.kriss.re.kr"
  - "time.cloudflare.com"

common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - chrony
  - jq
  - ca-certificates

sysctl_settings:
  fs.file-max: 2097152
  fs.inotify.max_user_watches: 524288
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  net.core.netdev_max_backlog: 10000
  net.ipv4.ip_local_port_range: "1024 65535"
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.tcp_keepalive_intvl: 30
  net.ipv4.tcp_keepalive_probes: 5
  vm.swappiness: 10
  vm.max_map_count: 262144
  vm.overcommit_memory: 1

system_limits:
  - domain: "*"
    limit_type: "soft"
    limit_item: "nofile"
    value: 65535
  - domain: "*"
    limit_type: "hard"
    limit_item: "nofile"
    value: 65535
  - domain: "*"
    limit_type: "soft"
    limit_item: "nproc"
    value: 65535
  - domain: "*"
    limit_type: "hard"
    limit_item: "nproc"
    value: 65535
  - domain: "root"
    limit_type: "soft"
    limit_item: "nofile"
    value: 65535
  - domain: "root"
    limit_type: "hard"
    limit_item: "nofile"
    value: 65535

journald_max_use: "2G"
journald_max_retention: "1month"
