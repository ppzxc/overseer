---
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: yes
    enabled: true

- name: Restart otelcol-contrib
  ansible.builtin.systemd:
    name: otelcol-contrib
    state: restarted
    daemon_reload: yes
    enabled: true
  failed_when: false
