---
# 온프레미스 IDC 서버 그룹 변수 (Standard UTC / Leap Smear 미적용 소스 일원화)
ntp_pools:
  - "kr.pool.ntp.org"

ntp_servers:
  - "time.kriss.re.kr"
  - "time2.kriss.re.kr"
  - "time.cloudflare.com"

# 커널 파라미터 (sysctl) 튜닝
sysctl_settings:
  fs.file-max: 2097152
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.ip_local_port_range: "1024 65535"
  vm.swappiness: 10
  vm.max_map_count: 262144

# 패키지 업데이트 및 기본 도구
common_packages:
  - curl
  - wget
  - git
  - vim
  - net-tools
  - chrony
  - jq
  - ca-certificates
  - tar
  - gzip

