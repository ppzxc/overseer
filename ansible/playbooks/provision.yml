---
# ==============================================================================
# 신규 온프레미스 서버 베이스라인 프로비저닝 플레이북
# 실행 예시:
#   ansible-playbook -i inventory/hosts.yml playbooks/provision.yml --limit node-01.idc.internal
# ==============================================================================

- name: Provision Baseline On-Premise IDC Nodes
  hosts: idc_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify connectivity and OS facts
      ansible.builtin.debug:
        msg: "Provisioning node: {{ inventory_hostname }} (OS: {{ ansible_distribution }} {{ ansible_distribution_version }})"

  roles:
    - role: common
      tags: [common, base]

    - role: security
      tags: [security, ssh, firewall]

    - role: vault_ssh_ca
      tags: [vault, security, ssh-ca]

    - role: boundary_target
      tags: [boundary, access]

    - role: monitoring
      tags: [monitoring, metrics]

  post_tasks:
    - name: Provisioning completion summary
      ansible.builtin.debug:
        msg: "Successfully provisioned {{ inventory_hostname }}. Vault SSH CA and Boundary Target ready."
