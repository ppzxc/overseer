services:
  # 1. Database (PostgreSQL for Boundary)
  postgres:
    image: postgres:15-alpine
    container_name: overseer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boundary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boundarypassword}
      POSTGRES_DB: ${POSTGRES_DB:-boundary}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - overseer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boundary}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. OpenBao Server
  openbao:
    image: openbao/openbao:latest
    container_name: overseer-openbao
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
      BAO_API_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./openbao/config:/openbao/config:ro
      - ./openbao/data:/openbao/data
      - ./openbao/scripts:/openbao/scripts:ro
    entrypoint: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    networks:
      - overseer-net

  # 3. HashiCorp Boundary Controller
  boundary-controller:
    image: hashicorp/boundary:0.15
    container_name: overseer-boundary-controller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9200:9200"
      - "9201:9201"
    volumes:
      - ./boundary/config:/boundary/config:ro
      - ./boundary/scripts:/boundary/scripts:ro
    command: ["boundary", "server", "-config=/boundary/config/controller.hcl"]
    networks:
      - overseer-net

  # 4. HashiCorp Boundary Worker
  boundary-worker:
    image: hashicorp/boundary:0.15
    container_name: overseer-boundary-worker
    restart: unless-stopped
    depends_on:
      - boundary-controller
    ports:
      - "9202:9202"
    volumes:
      - ./boundary/config:/boundary/config:ro
    command: ["boundary", "server", "-config=/boundary/config/worker.hcl"]
    networks:
      - overseer-net

  # 5. Ansible Provisioning Runner
  ansible:
    build:
      context: ./ansible
      dockerfile: Dockerfile
    image: overseer-ansible:latest
    container_name: overseer-ansible-runner
    volumes:
      - ./ansible:/ansible
      - ./openbao/data:/openbao/data:ro
      - ~/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ANSIBLE_FORCE_COLOR=True
      - BAO_ADDR=http://openbao:8200
    working_dir: /ansible
    networks:
      - overseer-net
    entrypoint: ["ansible-playbook"]
    command: ["--help"]

volumes:
  postgres-data:

networks:
  overseer-net:
    driver: bridge
